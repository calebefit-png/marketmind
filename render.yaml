services:
  - type: web
    name: marketmind
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_NAME
        value: MarketMind AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: BINANCE_WS_URL
        value: wss://stream.binance.com:9443/ws
      - key: BINANCE_REST_URL
        value: https://api.binance.com/api/v3
      - key: BCB_SGS_URL
        value: https://api.bcb.gov.br/dados/serie/bcdata.sgs.{code}/dados
